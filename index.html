<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandos Esenciales · Lenguajes, Frameworks y Herramientas</title>
  <meta name="description" content="Cheat sheet con comandos esenciales para desarrolladores: lenguajes, frameworks y herramientas, con búsqueda, favoritos y copiado en un clic.">
  <meta name="color-scheme" content="dark light">

  <!-- Aplica el tema guardado antes de pintar para evitar parpadeos -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('cs:theme'));
        var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css">

  <!-- Orden importa: datos → utilidades → render → ui → arranque -->
  <script src="data.js" defer></script>
  <script src="utils.js" defer></script>
  <script src="render.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" aria-label="Comandos Esenciales, inicio">⚡ <span>Comandos</span></a>

      <div class="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Busca un comando, una herramienta o una acción…"
               aria-label="Buscar comandos" autocomplete="off" spellcheck="false">
        <button id="clearSearch" class="search-clear" aria-label="Limpiar búsqueda" hidden>✕</button>
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </div>

      <button id="themeToggle" class="icon-btn theme-btn" aria-label="Cambiar tema">☀️</button>
    </div>

    <div class="topbar-inner chips-row">
      <div id="chips" class="chips" role="group" aria-label="Filtrar por categoría"></div>
    </div>
  </header>

  <div id="top" class="container">
    <section class="hero">
      <h1>Comandos Esenciales</h1>
      <p class="subtitle">Cheat sheet para devs · Lenguajes, frameworks y herramientas</p>
      <div id="stats" class="stats"></div>
    </section>

    <div class="layout">
      <aside class="sidebar" aria-label="Índice de tecnologías">
        <nav id="sidebarNav"></nav>
      </aside>

      <div class="content">
        <p id="resultInfo" class="result-info" aria-live="polite"></p>
        <main id="mainContent"></main>
      </div>
    </div>

    <footer>
      <p>Derian J. · Comandos esenciales · 2026</p>
      <p class="footer-hint">Atajos: <kbd class="kbd">/</kbd> buscar · <kbd class="kbd">Esc</kbd> limpiar</p>
    </footer>
  </div>

  <button id="backToTop" class="back-to-top" aria-label="Volver arriba" title="Volver arriba">↑</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Esta página necesita JavaScript para mostrar los comandos.</p></noscript>
</body>
</html>
